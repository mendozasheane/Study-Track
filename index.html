
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyTrack | Academic Management System</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP HEADER -->
    <header class="topbar">

        <div>
            <h1>StudyTrack</h1>
            <p>Student Academic Management System</p>
        </div>

        <!-- ROLE SELECTION -->
        <div class="role-box">
            <label for="role">Select Portal:</label>

            <select id="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
            </select>
        </div>

        <h3 id="portal">STUDENT PORTAL</h3>

    </header>


    <!-- MAIN LAYOUT -->
    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">

            <h2>StudyTrack</h2>

            <p class="menu-label">MAIN MENU</p>

            <!-- Navigation generated by JavaScript -->
            <nav id="navigation"></nav>

            <div class="sidebar-footer">
                <p>StudyTrack</p>
                <small>Academic Management System</small>
            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- PAGE HEADER -->
            <div class="page-header">

                <div>
                    <p class="page-subtitle">COLLEGE ACADEMIC PORTAL</p>
                    <h2 id="heading">Dashboard</h2>
                </div>

                <!-- Mobile Menu Button -->
                <button id="menuToggle" class="menu-toggle"
                    aria-label="Toggle navigation">
                    ☰
                </button>

            </div>


            <!-- PAGE CONTENT -->
            <section id="content">

                <!-- Content will be displayed using JavaScript -->

            </section>

            <!-- FOOTER -->
            <footer class="main-footer">
                <p>© 2026 StudyTrack. All Rights Reserved.</p>
                <small>Student Academic Management System</small>
            </footer>

        </main>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
